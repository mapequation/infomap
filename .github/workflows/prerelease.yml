name: Prerelease

on:
  push:
    tags:
      - "v*.*.*-rc.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build.
        required: false
        type: string
        default: ""
      features:
        description: Space- or comma-separated compile-time features.
        required: false
        type: string
        default: regularized-multilayer
      publish:
        description: Publish feature wheel artifacts to PyPI.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && (inputs.ref || github.sha) || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.features || 'tag' }}
  cancel-in-progress: false

jobs:
  validate-prerelease-tag:
    name: Validate prerelease tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta)\.[0-9]+$ ]]; then
            echo "Expected prerelease tag vX.Y.Z-rc.N or vX.Y.Z-beta.N, got: $RELEASE_TAG" >&2
            exit 1
          fi

  python:
    needs: [validate-prerelease-tag]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.validate-prerelease-tag.result == 'success') }}
    uses: ./.github/workflows/_python-package.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || github.sha) || github.ref }}
      run-tests: true
      mode: full
      build-release-artifacts: true
      features: ${{ github.event_name == 'workflow_dispatch' && inputs.features || '' }}

  javascript:
    needs: [validate-prerelease-tag]
    if: ${{ needs.validate-prerelease-tag.result == 'success' }}
    uses: ./.github/workflows/_js-package.yml
    with:
      ref: ${{ github.ref }}
      run-tests: true
      pack-artifact: true

  publish-pypi:
    name: Publish prerelease to PyPI
    if: github.event_name == 'push'
    needs: [python, javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-prerelease
      url: https://pypi.org/project/infomap/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist/python

      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheels-*
          path: dist/python
          merge-multiple: true

      - name: Verify Python distributions
        run: ls -la dist/python

      - name: Publish prerelease package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/python
          attestations: true

  publish-feature-pypi:
    name: Publish feature prerelease wheels to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-prerelease
      url: https://pypi.org/project/infomap/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheels-*
          path: dist/python
          merge-multiple: true

      - name: Verify Python wheels
        run: |
          find dist/python -maxdepth 1 -name '*.whl' -print | sort
          wheel_count="$(find dist/python -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')"
          [ "$wheel_count" -gt 0 ]
          # These wheels are compiled with experimental features on, and this job
          # uploads them to the production `infomap` project. A stable version here
          # would take that version on PyPI as wheel-only feature builds -- the real
          # release of the same version then fails on duplicate filenames, and a
          # plain `pip install infomap` hands out a feature build. RELEASING.md
          # requires a prerelease version; the only previous gate was that at least
          # one wheel existed, so assert the rule instead of trusting the dispatcher.
          python3 - dist/python <<'PY'
          import pathlib
          import re
          import sys

          # PEP 440 pre-releases and dev releases: 1.2.3rc1, 1.2.3a1, 1.2.3b2, 1.2.3.dev4.
          PRERELEASE = re.compile(r"^\d+(?:\.\d+)*(?:(?:a|b|rc)\d+|\.dev\d+)")
          # Wheel filenames are {name}-{version}-{python}-{abi}-{platform}.whl.
          versions = sorted({p.name.split("-")[1] for p in pathlib.Path(sys.argv[1]).glob("*.whl")})
          if not versions:
              sys.exit("no wheel versions could be read from the filenames")
          stable = [v for v in versions if not PRERELEASE.match(v)]
          for version in versions:
              print(f"{'stable' if version in stable else 'prerelease'}: {version}")
          if stable:
              print(
                  f"::error::feature wheels carry non-prerelease version(s) {', '.join(stable)}. "
                  "Feature builds must not occupy a stable version on PyPI; bump the version "
                  "to a prerelease (e.g. X.Y.ZrcN) before dispatching with publish=true.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Publish feature prerelease wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/python
          attestations: true

  publish-npm:
    name: Publish prerelease to npm
    if: github.event_name == 'push'
    needs: [python, javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm-prerelease
      url: https://www.npmjs.com/package/@mapequation/infomap
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist/npm

      - name: Publish npm prerelease package
        run: npm publish --provenance --tag next --access public dist/npm/*.tgz
