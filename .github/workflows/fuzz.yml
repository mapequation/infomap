name: Fuzz

# Non-blocking early warning: fuzz the network intake for crashes / sanitizer
# reports on malformed input, and full runs and cluster data input for broken
# flow invariants. A
# separate workflow (nothing depends on it) so it never gates PRs, but it goes
# RED when a reproducer is found. Mirrors the non-blocking pattern of
# python-prerelease-check.yml -- do NOT add continue-on-error, that would mask
# the alert. fuzz-pr.yml runs the same targets for 60 s on PRs that touch them,
# from the corpus this workflow saves.
on:
  schedule:
    - cron: "0 5 * * 2" # Tuesdays 05:00 UTC (clear of the Monday crons)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-intake:
    name: Fuzz network intake, runs and cluster data
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang
        # libclang-rt-dev ships the libFuzzer/ASAN runtime archives the fuzz
        # target links. It is only a Recommends of clang: runners install
        # Recommends today, but that is not a contract, so name it explicitly.
        # The unversioned metapackage tracks the image's default clang.
        run: |
          # A third-party repo in the runner image (azure-cli, chrome, ...) can
          # 403, which fails `apt-get update` even when the Ubuntu archive we
          # install from downloaded fine. The install is the real gate.
          sudo apt-get update || echo "::warning::apt-get update reported errors; continuing to the install"
          sudo apt-get install -y clang libclang-rt-dev

      # The evolved corpus compounds across the weekly runs instead of
      # restarting from the fixture seeds every time. Restore latest, save
      # under a per-run key.
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Build and run the intake fuzzer
        run: make fuzz FUZZ_SECONDS=300

      # always(): a red run means the fuzzer found something -- exactly the
      # corpus worth keeping. The hashFiles guard skips the save when the job
      # failed before the corpus existed (e.g. a build failure).
      - name: Save fuzz corpus
        if: always() && hashFiles('build/fuzz/corpus/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      # The full-run target: fuzzer-chosen options on a small network, with
      # the flow invariants on. Its own corpus, cached separately. Runs even
      # when the intake step found something, so one red step does not hide
      # the other.
      - name: Restore run fuzz corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus-run
          key: fuzz-run-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-run-corpus-

      - name: Build and run the full-run fuzzer
        if: ${{ !cancelled() }}
        run: make fuzz FUZZ_TARGET=run FUZZ_SECONDS=300

      - name: Save run fuzz corpus
        if: always() && hashFiles('build/fuzz/corpus-run/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus-run
          key: fuzz-run-corpus-${{ github.run_id }}

      # The cluster data target: .clu, .tree and .ftree input (--cluster-data)
      # on small fixed networks, with the flow invariants and codelength checks
      # on. Its own corpus, cached separately, and it runs whatever the steps
      # above found.
      - name: Restore cluster fuzz corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus-cluster
          key: fuzz-cluster-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-cluster-corpus-

      - name: Build and run the cluster data fuzzer
        if: ${{ !cancelled() }}
        run: make fuzz FUZZ_TARGET=cluster FUZZ_SECONDS=300

      - name: Save cluster fuzz corpus
        if: always() && hashFiles('build/fuzz/corpus-cluster/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus-cluster
          key: fuzz-cluster-corpus-${{ github.run_id }}

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: |
            build/fuzz/*crash-*
            build/fuzz/*timeout-*
            build/fuzz/*leak-*
            build/fuzz/*oom-*
          if-no-files-found: ignore
          retention-days: 14

  # Non-blocking workflow: surface a scheduled failure (a reproducer was found)
  # as a tracking issue so it is not lost in the Actions tab. Only fires for
  # cron runs -- a manual dispatch failure is seen by whoever triggered it.
  report-failure:
    name: Report scheduled failure
    needs: [fuzz-intake]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open or update the tracking issue
        uses: ./.github/actions/report-cron-failure
        with:
          workflow-name: ${{ github.workflow }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ github.token }}
