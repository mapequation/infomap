name: TSan

# Weekly run of the TSan job (_tsan.yml). PRs and pushes that touch the core
# run the same job as a blocking part of ci.yml; this run catches toolchain
# drift (a new clang or libomp in the runner image) between core changes and
# files a tracking issue when it goes red.
on:
  schedule:
    - cron: "0 5 * * 3" # Wednesdays 05:00 UTC (clear of the Monday/Tuesday crons)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    uses: ./.github/workflows/_tsan.yml

  # Surface a scheduled failure as a tracking issue so it is not lost in the
  # Actions tab. Only fires for cron runs.
  report-failure:
    name: Report scheduled failure
    needs: [tsan]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open or update the tracking issue
        uses: ./.github/actions/report-cron-failure
        with:
          workflow-name: ${{ github.workflow }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ github.token }}
