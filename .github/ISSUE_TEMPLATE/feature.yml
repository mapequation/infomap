name: Feature request
description: Propose a new or changed Infomap capability.
title: "[Feature]: "
# No labels: here on purpose. This repository labels by component (python, R,
# build, docs, test, performance, ...), not by issue type, so the type label a
# template could declare does not exist -- declaring one silently drops it and
# the issue arrives unlabelled. The component is not knowable from the template.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user problem this would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the CLI, Python, JavaScript, or documentation behavior you want.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI / C++ runtime
        - Python package
        - JavaScript package
        - Documentation
        - Packaging / release
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or related tools if any.
